[package]
name = "slipway-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
description = "Slipway — the estate's Android build/sign/verify/install/release MCP server: builds the Owner's own apps from their own trees, verifies and installs them, certifies publish readiness by executing the publish skills' gate batteries, and prepares Owner-stamped release bundles. Modern MCP era only (2026-07-28)."

[lib]
name = "slipway"
path = "src/lib.rs"

[[bin]]
name = "slipway"
path = "src/main.rs"

[dependencies]
# Fleet pin (D-113): one rmcp version across every estate server.
# Born modern-only — no legacy era ever exists in this server.
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "client", "transport-child-process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
ed25519-dalek = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[lints.clippy]
all = "warn"
